<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Voedingscheck</title>
<meta name="description" content="Dagelijkse voedingscheck: vink af wat je vandaag hebt gegeten.">
<meta name="theme-color" content="#2fb45d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voedingscheck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --g1:#34b866; --g2:#17a3a4; --g3:#2b78d6;
  --white:#fff; --track:rgba(255,255,255,.32); --ink:#101418; --over:#ff3b30;
  --ring:140px; --stroke:9;
  --cond:"Avenir Next Condensed","AvenirNextCondensed-Bold","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--white);
  background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%) fixed;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100vw;height:100%;scroll-snap-align:start;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);
  padding:calc(env(safe-area-inset-top) + 34px) 12px 14px;align-items:start;justify-items:center}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;
  background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;
  transition:transform .12s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tile:active{transform:scale(.95)}
.tile.pop{animation:pop .36s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.ring{position:relative;width:var(--ring);height:var(--ring)}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring svg.r circle{fill:none;stroke-width:var(--stroke);stroke-linecap:butt}
.ring .track{stroke:var(--track)}
.ring .bar{stroke:var(--white);transition:stroke-dashoffset .45s cubic-bezier(.3,.9,.3,1),opacity .2s}
.ring svg.r .disc{fill:var(--white);opacity:0;transform:scale(.7);transform-origin:center;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.4)}
.ring .icon{position:absolute;inset:0;display:grid;place-items:center;color:var(--white);transition:transform .3s cubic-bezier(.2,.9,.3,1.4),color .3s}
.ring .icon svg{width:64px;height:64px;fill:currentColor;stroke:none;margin-top:-16px}
.ring .n{position:absolute;left:0;right:0;bottom:17px;text-align:center;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.2px;font-variant-numeric:tabular-nums;transition:color .3s}
.tile[data-n="0"] .ring .bar{opacity:0}
.label{font-family:var(--cond);font-weight:700;font-size:20px;line-height:1.1;letter-spacing:.2px;text-transform:uppercase;text-align:center;max-width:170px;text-wrap:balance}
.label .pre{font-size:17px;margin-right:6px;position:relative;top:-1px}
.label .amt{display:block;font-size:15px;font-weight:600;opacity:.85;letter-spacing:0;text-transform:none;margin-top:2px}
/* done: white disc, ink glyph */
.tile.done .ring .disc{opacity:1;transform:scale(1)}
.tile.done .ring .track,.tile.done .ring .bar{opacity:0}
.tile.done .icon{color:var(--ink);transform:scale(1.04)}
.tile.done .ring .n{color:var(--ink)}
/* a limit reached is a complete ring, not a win */
.tile.max.done .ring .disc{opacity:0}
.tile.max.done .ring .bar{opacity:1}
.tile.max.done .icon{color:var(--white);transform:none}
.tile.max.done .ring .n{color:var(--white)}
/* over the limit: red disc */
.tile.over .ring svg.r .disc{opacity:1;transform:scale(1);fill:var(--over)}
.tile.over .ring .track,.tile.over .ring .bar{opacity:0}
.tile.over .icon{color:var(--white)}
.tile.over .label{color:#ffd2ce}
/* undo satellite, appears on the tile you just tapped */
.minus{position:absolute;right:-6px;bottom:-4px;width:44px;height:44px;border-radius:50%;background:var(--white);color:var(--ink);
  display:grid;place-items:center;font-size:26px;font-weight:700;line-height:1;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tile.recent .minus{opacity:1;transform:scale(1);pointer-events:auto}
/* summary + more slots */
.tile.sum .ring .n{font-size:17px;bottom:15px}
.tile.more .ring .track{stroke:var(--track)}
.tile.more .icon svg{margin-top:0;width:56px;height:56px}
.tile.sum .icon svg{width:64px;height:64px}
/* chrome */
.dots{height:calc(env(safe-area-inset-bottom) + 34px);display:flex;justify-content:center;align-items:flex-start;gap:9px;padding-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45)} .dots i.on{background:var(--white)}
.sheet{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:rgba(255,255,255,.96);color:var(--ink);border-radius:22px;padding:8px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet.open{display:block}
.sheet p{margin:10px 12px 12px;font-size:14px;line-height:1.5;color:#3a3f45}
.sheet p b{color:var(--ink);font-weight:700}
.sheet .key{display:flex;gap:16px;justify-content:center;margin:0 0 10px;font-size:13px;color:#3a3f45;font-weight:600}
.sheet button{display:block;width:100%;background:#eef1f4;border:0;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:14px;border-radius:14px;cursor:pointer;margin-top:6px}
.sheet button.arm{color:var(--over)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 48px);transform:translateX(-50%) translateY(20px);
  background:rgba(16,20,24,.85);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.tile.pop{animation:none}.ring .bar,.icon,.disc{transition:none}}
</style>
</head>
<body>
<div class="pages" id="pages">
  <section class="page" id="p1"></section>
  <section class="page" id="p2"></section>
</div>
<div class="dots" id="dots"><i class="on"></i><i></i></div>
<div class="sheet" id="sheet">
  <p><b>Tik</b> een ring om af te vinken. <b>Houd vast</b> of tik <b>−</b> om één terug te zetten. Elke dag begint de lijst leeg.</p>
  <div class="key"><span>♥ doel</span><span>⊘ maximum</span><span style="color:var(--over)">● te veel</span></div>
  <button id="reset">Dag opnieuw beginnen</button>
  <button id="closeSheet">Sluiten</button>
</div>
<div class="toast" id="toast"></div>

<script>
const G = {
  bean:'<path d="M12 2.8c-3.7 0-7.2 5.7-7.2 10.8a7.2 7.2 0 0014.4 0C19.2 8.5 15.7 2.8 12 2.8z"/>',
  olive:'<g transform="translate(0.00 -0.00)"><path d="M12 21.2c3.4 0 5.4-3.1 5.4-6.7S15.4 7.9 12 7.9s-5.4 3-5.4 6.6 2 6.7 5.4 6.7z"/><path d="M12.4 7.6c-.3-2.5 1.4-4.6 4.5-4.8-.2 2.5-1.8 4.5-4.5 4.8z"/></g>',
  wheat:'<g transform="translate(0.00 -1.10)"><path d="M4 9.6C4 7.1 6 5.2 8.4 5.2c.9 0 1.7.2 2.4.7.4-.2.8-.3 1.2-.3s.8.1 1.2.3c.7-.5 1.5-.7 2.4-.7C18 5.2 20 7.1 20 9.6c0 1.3-.6 2.5-1.5 3.3V20a1 1 0 01-1 1h-11a1 1 0 01-1-1v-7.1C4.6 12.1 4 10.9 4 9.6z"/></g>',
  milk:'<g transform="translate(-0.00 -0.00)"><path d="M6.3 3h11.4l-1.4 16.7A1.5 1.5 0 0114.8 21H9.2a1.5 1.5 0 01-1.5-1.3L6.3 3z"/></g>',
  apple:'<g transform="translate(-0.00 0.06)"><path d="M12 7.9c-1.9-1.7-6.2-1.5-6.2 3.7 0 4 2.8 8.4 5.1 8.4.6 0 1.1-.4 1.1-.4s.5.4 1.1.4c2.3 0 5.1-4.4 5.1-8.4 0-5.2-4.3-5.4-6.2-3.7z"/><path d="M12.4 6.9c.2-2 1.8-3.2 4-3-.2 2-1.8 3.2-4 3z"/><path d="M11.4 7.2c-.1-1.2.2-2.3.9-3.2l.9.7c-.5.7-.8 1.6-.7 2.5z"/></g>',
  cheese:'<g transform="translate(0.00 -0.25)"><path fill-rule="evenodd" d="M2.5 19.5L21.5 5v14.5H2.5zM13.5 17.6a1.6 1.6 0 100-3.2 1.6 1.6 0 000 3.2zM18.3 13.4a1.1 1.1 0 100-2.2 1.1 1.1 0 000 2.2zM8.2 18.4a.9.9 0 100-1.8.9.9 0 000 1.8z"/></g>',
  peanut:'<g transform="translate(0.00 -0.75)"><path fill-rule="evenodd" d="M5.5 9.5h13v9a2.5 2.5 0 01-2.5 2.5H8A2.5 2.5 0 015.5 18.5v-9zM8 12.5v3.5h8v-3.5H8z"/><path d="M7.5 4.5h9a1.5 1.5 0 011.5 1.5v2.3H6V6a1.5 1.5 0 011.5-1.5z"/></g>',
  shaker:'<g transform="translate(0.00 0.25)"><path d="M7.5 8.5h9a1 1 0 011 1V19a2.5 2.5 0 01-2.5 2.5H9A2.5 2.5 0 016.5 19V9.5a1 1 0 011-1z"/><path d="M9 4.5h6a1 1 0 011 1v2H8v-2a1 1 0 011-1z"/><path d="M11 2h2v2h-2z"/></g>',
  broccoli:'<g transform="translate(-0.00 0.14)"><path d="M6.3 12.6a3.4 3.4 0 01.7-6.6A4.3 4.3 0 0112 2.8a4.3 4.3 0 015 3.2 3.4 3.4 0 01.7 6.6H6.3z"/><path d="M9.3 13.8h5.4v5.4a1.8 1.8 0 01-1.8 1.8h-1.8a1.8 1.8 0 01-1.8-1.8v-5.4z"/></g>',
  rice:'<g transform="translate(0.00 -1.30)"><path d="M3 11.8h18a9 9 0 01-18 0z"/><path d="M6.2 10.4c1.1-2.9 3.2-4.6 5.8-4.6s4.7 1.7 5.8 4.6H6.2z"/></g>',
};
G.check='<path d="M9.2 18.6 3.4 12.8l2.3-2.3 3.5 3.5 9.1-9.1 2.3 2.3z"/>';
G.more='<circle cx="5" cy="12" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="19" cy="12" r="2.3"/>';
const ITEMS = [
  {id:'volkoren', name:'Volkoren', target:8, kind:'goal', icon:'wheat', page:1},
  {id:'zuivel',   name:'Zuivel',   target:4, kind:'goal', icon:'milk', page:1},
  {id:'fruit',    name:'Fruit',    target:3, kind:'goal', icon:'apple', page:1},
  {id:'kaas',     name:'Kaas',     target:2, kind:'max',  icon:'cheese', page:1},
  {id:'pindakaas',name:'Pindakaas',target:3, kind:'max',  icon:'peanut', page:1},
  {id:'eiwit',    name:'Eiwitpoeder', target:2, kind:'max', icon:'shaker', page:1},
  {id:'groenten', name:'Groenten', target:1, amt:'≥ 200 g', kind:'goal', icon:'broccoli', page:2},
  {id:'graan',    name:'Granen',   target:1, amt:'75–100 g', kind:'goal', icon:'rice', page:2},
  {id:'eiwitbron',name:'Eiwitbron', target:1, amt:'100–135 g', kind:'goal', icon:'bean', page:2},
  {id:'olijfolie',name:'Olijfolie', target:1, amt:'1 eetlepel', kind:'goal', icon:'olive', page:2},
];
const GOALS=ITEMS.filter(i=>i.kind==='goal');
const KEY='voedingscheck.v1';
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&s.date===todayKey()&&s.counts) return s;}catch(e){}
  return {date:todayKey(),counts:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function rollover(){ if(state.date!==todayKey()){state={date:todayKey(),counts:{}};save();renderAll();} }

const R=45.5, C=2*Math.PI*R;
function ringSVG(){return `<svg class="r" viewBox="0 0 100 100"><circle class="disc" cx="50" cy="50" r="50"/><circle class="track" cx="50" cy="50" r="${R}"/><circle class="bar" cx="50" cy="50" r="${R}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"/></svg>`}
function tileHTML(it){
  const pre = it.kind==='max' ? '<span class="pre">⊘</span>' : '<span class="pre">♥</span>';
  const amt = it.amt ? `<span class="amt">${it.amt}</span>` : '';
  const n = it.target>1 ? `<div class="n"><span class="v">0</span>/${it.target}</div>` : `<div class="n" hidden><span class="v">0</span></div>`;
  return `<button class="tile ${it.kind}" id="t-${it.id}" data-id="${it.id}" data-n="0" aria-label="${it.name}">
    <div class="ring">${ringSVG()}<div class="icon"><svg viewBox="0 0 24 24">${G[it.icon]}</svg></div>${n}
      <span class="minus" data-minus="${it.id}" aria-label="één terug">−</span></div>
    <div class="label">${pre}${it.name}${amt}</div>
  </button>`;
}
function renderAll(){
  document.getElementById('p1').innerHTML=ITEMS.filter(i=>i.page===1).map(tileHTML).join('');
  document.getElementById('p2').innerHTML=ITEMS.filter(i=>i.page===2).map(tileHTML).join('')+
    `<div class="tile sum" id="total" data-frac="0/${GOALS.length}"><div class="ring">${ringSVG()}<div class="icon"><svg viewBox="0 0 24 24">${G.check}</svg></div><div class="n"><span id="totalNum">0</span>/${GOALS.length}</div></div><div class="label">Doelen vandaag</div></div>`+
    `<button class="tile more" id="more"><div class="ring">${ringSVG()}<div class="icon"><svg viewBox="0 0 24 24">${G.more}</svg></div></div><div class="label">Meer</div></button>`;
  ITEMS.forEach(i=>update(i));
  document.getElementById('more').addEventListener('click',()=>document.getElementById('sheet').classList.toggle('open'));
}
function update(it, pop){
  const n=state.counts[it.id]||0, el=document.getElementById('t-'+it.id);
  const frac=Math.min(n/it.target,1);
  el.querySelector('.bar').style.strokeDashoffset=(C*(1-frac)).toFixed(2);
  el.querySelector('.v').textContent=n;
  el.dataset.n=n;
  el.classList.toggle('done', n===it.target);
  el.classList.toggle('over', it.kind==='max' && n>it.target);
  if(pop){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
  updateTotal();
}
function updateTotal(){
  const done=GOALS.filter(i=>(state.counts[i.id]||0)>=i.target).length;
  const t=document.getElementById('total');
  document.getElementById('totalNum').textContent=done; t.dataset.frac=done+'/'+GOALS.length;
  t.querySelector('.bar').style.strokeDashoffset=(C*(1-done/GOALS.length)).toFixed(2);
  t.querySelector('.bar').style.opacity=done?1:0;
  t.classList.toggle('done',done===GOALS.length);
  document.title = done===GOALS.length ? 'Voedingscheck ✓' : 'Voedingscheck';
}
let recentT;
function markRecent(el){
  document.querySelectorAll('.tile.recent').forEach(t=>t.classList.remove('recent'));
  if(!el || el.dataset.n==='0') return;
  el.classList.add('recent'); clearTimeout(recentT); recentT=setTimeout(()=>el.classList.remove('recent'),3500);
}
function bump(id,delta){
  rollover();
  const it=ITEMS.find(i=>i.id===id); if(!it) return; const cur=state.counts[id]||0;
  let n=cur+delta; if(n<0)n=0;
  if(it.kind==='goal'&&n>it.target)n=it.target;
  if(it.kind==='max'&&n>it.target+1)n=it.target+1;
  const el=document.getElementById('t-'+id);
  if(n===cur){ if(delta>0) toast(it.kind==='goal'?`${it.name}: doel al gehaald`:`${it.name}: maximum al bereikt`); markRecent(el); return; }
  state.counts[id]=n; save(); update(it,true); markRecent(el);
  if(navigator.vibrate) navigator.vibrate(n>=it.target?[10,30,10]:8);
  if(it.kind==='max'&&n>it.target) toast(`${it.name}: boven het maximum van vandaag`);
  else if(it.kind==='goal'&&n===it.target&&delta>0) toast(`${it.name} gehaald`);
}
let tmr=null, held=false, tid=null, sx=0;
document.body.addEventListener('pointerdown',e=>{
  if(e.target.closest('.minus')) return;
  const t=e.target.closest('.tile[data-id]'); if(!t) return; held=false; tid=t.dataset.id; sx=e.clientX;
  tmr=setTimeout(()=>{held=true;bump(tid,-1)},500);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.body.addEventListener(ev,e=>{
  if(!tmr) return; clearTimeout(tmr); tmr=null;
  const t=e.target.closest('.tile[data-id]');
  if(ev==='pointerup'&&t&&!held&&t.dataset.id===tid&&Math.abs(e.clientX-sx)<12){
    const it=ITEMS.find(i=>i.id===tid);
    bump(tid, (it.target===1 && (state.counts[tid]||0)>=1) ? -1 : +1);
  }
}));
document.body.addEventListener('click',e=>{const m=e.target.closest('.minus'); if(m){e.stopPropagation();bump(m.dataset.minus,-1);}});
document.body.addEventListener('contextmenu',e=>{if(e.target.closest('.tile'))e.preventDefault()});
document.getElementById('closeSheet').addEventListener('click',()=>document.getElementById('sheet').classList.remove('open'));
let armed=false, armT;
document.getElementById('reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!armed){armed=true;b.textContent='Tik nogmaals om alles van vandaag te wissen';b.classList.add('arm');clearTimeout(armT);armT=setTimeout(()=>{armed=false;b.textContent='Dag opnieuw beginnen';b.classList.remove('arm')},2500);return;}
  armed=false;b.textContent='Dag opnieuw beginnen';b.classList.remove('arm');state={date:todayKey(),counts:{}};save();renderAll();
  document.getElementById('sheet').classList.remove('open');toast('Dag opnieuw begonnen');
});
const pages=document.getElementById('pages'), dots=[...document.querySelectorAll('#dots i')];
pages.addEventListener('scroll',()=>{const i=Math.round(pages.scrollLeft/pages.clientWidth);dots.forEach((d,k)=>d.classList.toggle('on',k===i));},{passive:true});
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500)}
renderAll();
try{ if(!localStorage.getItem(KEY+'.seen')){ setTimeout(()=>toast('Tik een ring om af te vinken · veeg voor de avondmaaltijd'),600); localStorage.setItem(KEY+'.seen','1'); } }catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollover()});
setInterval(rollover,60000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
