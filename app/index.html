<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Voedingscheck</title>
<meta name="description" content="Dagelijkse voedingscheck: vink af wat je vandaag hebt gegeten.">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voedingscheck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0b0b10; --card:#15151c; --card-2:#1c1c25;
  --text:#f5f5f7; --muted:#8b8b97; --faint:#5a5a66;
  --ink:#0b0b10;
  --goal:#3ddc73; --limit:#ffb340; --over:#ff4d3d;
  --r:22px; --gap:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}

/* hero: the day itself */
header{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 6px;gap:12px}
.day .date{color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.2px}
.day h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
.total{position:relative;width:140px;height:140px}
.total svg{width:140px;height:140px;transform:rotate(-90deg)}
.total circle{fill:none;stroke-width:11;stroke-linecap:round}
.total .tr{stroke:color-mix(in srgb,var(--goal) 22%,var(--bg))} .total .tb{stroke:var(--goal);transition:stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1)}
.total.zero .tb{opacity:0}
.total .t-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.total .t-num span{font-weight:800;font-size:38px;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.total .t-num small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-top:6px}
.total.all .t-num span{color:var(--goal)}
.day .sum{font-size:15px;color:var(--muted);font-weight:500}
.day .sum b{color:var(--text);font-weight:700}

h2{margin:0 2px 8px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}

/* rings on the page, no cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.grid.four{grid-template-columns:repeat(4,1fr);gap:6px}
.four .tile{padding:8px 0}
.four .tile .ring{width:78px;height:78px}
.four .tile .icon svg{width:40px;height:40px}
.four .tile .ring circle{stroke-width:7}
.tile{position:relative;background:transparent;border-radius:var(--r);padding:8px 2px 8px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;
  border:0;color:var(--text);font:inherit;cursor:pointer;min-width:0;--c:var(--goal);
  transition:transform .12s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tile.max{--c:var(--limit)}
.tile:active{transform:scale(.94)}
.tile.pop{animation:pop .36s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
.ring{position:relative;width:92px;height:92px}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .track{stroke:color-mix(in srgb,var(--c) 22%,var(--bg));transition:stroke .3s}
.ring .bar{stroke:var(--c);opacity:1;transition:stroke-dashoffset .45s cubic-bezier(.3,.9,.3,1),stroke .3s,opacity .2s}
.ring .disc{fill:var(--c);opacity:0;transform:scale(.6);transform-origin:center;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.4)}
.ring .icon{position:absolute;inset:0;display:grid;place-items:center;color:var(--c);transition:transform .3s cubic-bezier(.2,.9,.3,1.4),color .3s}
.ring .icon svg{width:46px;height:46px;fill:currentColor;stroke:none}
.tile[data-n="0"] .ring .bar{opacity:0}
.count{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center;gap:1px}
.count small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0;transition:color .3s}
.count .lim{display:none}
.name{font-size:13.5px;font-weight:600;color:#a3a3ae;letter-spacing:-.05px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-3px}
.badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--ink);box-shadow:0 0 0 3px var(--bg);display:grid;place-items:center;
  opacity:0;transform:scale(.3);transition:transform .35s cubic-bezier(.2,.9,.3,1.6),opacity .2s}
.badge svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* done: the ring becomes a solid disc, the glyph turns ink */
.tile.done .ring .disc{opacity:1;transform:scale(1)}
.tile.done .ring .track,.tile.done .ring .bar{opacity:0}
.tile.done .icon{color:var(--ink);transform:scale(1.08)}
.tile.max.done .name{color:var(--c)}                    /* limit reached: amber disc, amber words */
/* over the maximum: red disc, red words */
.tile.over{--c:var(--over)}
.tile.over .ring .disc{opacity:1;transform:scale(1)}
.tile.over .ring .track,.tile.over .ring .bar{opacity:0}
.tile.over .icon{color:var(--ink);transform:scale(1.08)}
.tile.over .count{color:var(--over)} .tile.over .count small{color:var(--over);opacity:.8}
.tile.over .name{color:var(--over);font-weight:700}
/* undo chip: appears only on the tile you just tapped */
.minus{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--card-2);color:var(--text);box-shadow:0 0 0 3px var(--bg);
  display:grid;place-items:center;font-size:17px;font-weight:700;line-height:1;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;pointer-events:none}
.tile.recent .minus{opacity:1;transform:scale(1);pointer-events:auto}
.minus:active{transform:scale(.85)}

/* dinner: same rings, the amount sits in the count slot */
.four .tile .minus{display:none}
.sub{font-size:13px;color:var(--muted);font-weight:700;line-height:1;letter-spacing:-.2px;white-space:nowrap;transition:color .3s}
h2.all{color:var(--goal)}

/* quiet chrome */
.more{margin:12px auto 0;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--muted);font:inherit;display:grid;place-items:center;cursor:pointer}
.more svg{width:18px;height:18px;fill:currentColor}
.sheet{display:none;margin:10px auto 0;max-width:340px;background:var(--card);border-radius:18px;padding:6px;text-align:center}
.sheet.open{display:block}
.sheet p{margin:8px 10px 10px;color:var(--muted);font-size:13px;line-height:1.5}
.sheet p b{color:var(--text);font-weight:600}
.sheet .key{display:flex;justify-content:center;gap:14px;margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:600}
.sheet .key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.sheet button{display:block;width:100%;background:var(--card-2);border:0;color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:13px;border-radius:13px;cursor:pointer}
.sheet button:active{opacity:.7}
.sheet button.arm{color:var(--over)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(20px);
  background:var(--card-2);color:var(--text);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:nowrap;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-color-scheme: light){
  :root{--bg:#f2f2f7;--card:#ffffff;--card-2:#e9e9ef;--text:#1c1c1e;--muted:#6e6e73;--faint:#9a9aa0;--goal:#2fbf63;--limit:#f0a11f}
}
@media (prefers-reduced-motion: reduce){.tile.pop{animation:none}.ring .bar,.icon,.badge,.disc{transition:none}}
</style>
</head>
<body>
<main>
<header>
  <div class="day"><h1 hidden>Voedingscheck</h1><div class="date" id="date"></div></div>
  <div class="total" id="total" aria-live="polite">
    <svg viewBox="0 0 140 140"><circle class="tr" cx="70" cy="70" r="63"/><circle class="tb" id="totalBar" cx="70" cy="70" r="63" stroke-dasharray="395.84" stroke-dashoffset="395.84"/></svg>
    <div class="t-num"><div><span id="totalNum">0/7</span><small>doelen</small></div></div>
  </div>
  <div class="day" hidden><div class="sum" id="sum"></div></div>
</header>

<section><h2>Door de dag</h2><div class="grid" id="dag"></div></section>
<section><h2 id="avondLabel">Avondmaaltijd</h2><div class="grid four" id="avond"></div></section>
</main>

<button class="more" id="more" aria-label="Meer"><svg viewBox="0 0 18 18"><circle cx="4" cy="9" r="1.7"/><circle cx="9" cy="9" r="1.7"/><circle cx="14" cy="9" r="1.7"/></svg></button>
<div class="sheet" id="sheet">
  <p><b>Tik</b> een ring om af te vinken. <b>Houd vast</b> of tik <b>−</b> om één terug te zetten.<br>Elke dag begint de lijst leeg.</p>
  <div class="key"><span><i style="background:var(--goal)"></i>doel</span><span><i style="background:var(--limit)"></i>maximum</span><span><i style="background:var(--over)"></i>te veel</span></div>
  <button id="reset">Dag opnieuw beginnen</button>
</div>
<div class="toast" id="toast"></div>

<script>
const G = {
  wheat:'<path d="M4 9.6C4 7.1 6 5.2 8.4 5.2c.9 0 1.7.2 2.4.7.4-.2.8-.3 1.2-.3s.8.1 1.2.3c.7-.5 1.5-.7 2.4-.7C18 5.2 20 7.1 20 9.6c0 1.3-.6 2.5-1.5 3.3V20a1 1 0 01-1 1h-11a1 1 0 01-1-1v-7.1C4.6 12.1 4 10.9 4 9.6z"/>',
  milk:'<path d="M6.3 3h11.4l-1.4 16.7A1.5 1.5 0 0114.8 21H9.2a1.5 1.5 0 01-1.5-1.3L6.3 3z"/>',
  apple:'<path d="M12 7.9c-1.9-1.7-6.2-1.5-6.2 3.7 0 4 2.8 8.4 5.1 8.4.6 0 1.1-.4 1.1-.4s.5.4 1.1.4c2.3 0 5.1-4.4 5.1-8.4 0-5.2-4.3-5.4-6.2-3.7z"/><path d="M12.4 6.9c.2-2 1.8-3.2 4-3-.2 2-1.8 3.2-4 3z"/><path d="M11.4 7.2c-.1-1.2.2-2.3.9-3.2l.9.7c-.5.7-.8 1.6-.7 2.5z"/>',
  cheese:'<path fill-rule="evenodd" d="M2.5 19.5L21.5 5v14.5H2.5zM13.5 17.6a1.6 1.6 0 100-3.2 1.6 1.6 0 000 3.2zM18.3 13.4a1.1 1.1 0 100-2.2 1.1 1.1 0 000 2.2zM8.2 18.4a.9.9 0 100-1.8.9.9 0 000 1.8z"/>',
  peanut:'<path fill-rule="evenodd" d="M5.5 9.5h13v9a2.5 2.5 0 01-2.5 2.5H8A2.5 2.5 0 015.5 18.5v-9zM8 12.5v3.5h8v-3.5H8z"/><path d="M7.5 4.5h9a1.5 1.5 0 011.5 1.5v2.3H6V6a1.5 1.5 0 011.5-1.5z"/>',
  shaker:'<path d="M3 13.5h12.5a6.25 6.25 0 01-12.5 0z"/><path d="M14.5 12.8l5.4-5.4a1.3 1.3 0 011.8 1.8l-5.4 5.4a7 7 0 00-1.8-1.8z"/>',
  broccoli:'<path d="M6.3 12.6a3.4 3.4 0 01.7-6.6A4.3 4.3 0 0112 2.8a4.3 4.3 0 015 3.2 3.4 3.4 0 01.7 6.6H6.3z"/><path d="M9.3 13.8h5.4v5.4a1.8 1.8 0 01-1.8 1.8h-1.8a1.8 1.8 0 01-1.8-1.8v-5.4z"/>',
  rice:'<path d="M3 11.8h18a9 9 0 01-18 0z"/><path d="M6.2 10.4c1.1-2.9 3.2-4.6 5.8-4.6s4.7 1.7 5.8 4.6H6.2z"/>',
  bean:'<path d="M12 2.8c-3.7 0-7.2 5.7-7.2 10.8a7.2 7.2 0 0014.4 0C19.2 8.5 15.7 2.8 12 2.8z"/>',
  olive:'<path d="M12 21.2c3.4 0 5.4-3.1 5.4-6.7S15.4 7.9 12 7.9s-5.4 3-5.4 6.6 2 6.7 5.4 6.7z"/><path d="M12.4 7.6c-.3-2.5 1.4-4.6 4.5-4.8-.2 2.5-1.8 4.5-4.5 4.8z"/>',
};
const ITEMS = [
  {id:'volkoren', name:'Volkoren', target:8, kind:'goal', icon:'wheat', g:'dag'},
  {id:'zuivel',   name:'Zuivel',   target:4, kind:'goal', icon:'milk', g:'dag'},
  {id:'fruit',    name:'Fruit',    target:3, kind:'goal', icon:'apple', g:'dag'},
  {id:'kaas',     name:'Kaas',     target:2, kind:'max',  icon:'cheese', g:'dag'},
  {id:'pindakaas',name:'Pindakaas',target:3, kind:'max',  icon:'peanut', g:'dag'},
  {id:'eiwit',    name:'Eiwitpoeder', target:2, kind:'max', icon:'shaker', g:'dag'},
  {id:'groenten', name:'Groenten', target:1, sub:'≥ 200 g', kind:'goal', icon:'broccoli', g:'avond'},
  {id:'graan',    name:'Granen',   target:1, sub:'75–100 g', kind:'goal', icon:'rice', g:'avond'},
  {id:'eiwitbron',name:'Eiwitbron', target:1, sub:'100–135 g', kind:'goal', icon:'bean', g:'avond'},
  {id:'olijfolie',name:'Olijfolie', target:1, sub:'1 eetlepel', kind:'goal', icon:'olive', g:'avond'},
];
const KEY='voedingscheck.v1';
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&s.date===todayKey()&&s.counts) return s;}catch(e){}
  return {date:todayKey(),counts:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function rollover(){ if(state.date!==todayKey()){state={date:todayKey(),counts:{}};save();renderAll();} }

const R=46, C=2*Math.PI*R;
const CHECK='<svg viewBox="0 0 12 12"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg>';
function tileHTML(it){
  const count = it.kind==='max'
    ? `<div class="count"><span class="n">0</span><small>/${it.target}</small></div>`
    : `<div class="count"><span class="n">0</span><small>/${it.target}</small></div>`;
  return `<button class="tile ${it.kind}" id="t-${it.id}" data-id="${it.id}" data-n="0" aria-label="${it.name}">
    <span class="minus" data-minus="${it.id}" aria-label="één terug">−</span>
    <div class="ring"><svg class="r" viewBox="0 0 100 100">
      <circle class="disc" cx="50" cy="50" r="${R+4}"/>
      <circle class="track" cx="50" cy="50" r="${R}"/>
      <circle class="bar" cx="50" cy="50" r="${R}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"/></svg>
      <div class="icon"><svg viewBox="0 0 24 24">${G[it.icon]}</svg></div>
    </div>
    ${it.g==='avond' ? `<div class="sub">${it.sub}</div>` : count}
    <div class="name">${it.name}</div>
  </button>`;
}
function renderAll(){
  document.getElementById('dag').innerHTML=ITEMS.filter(i=>i.g==='dag').map(tileHTML).join('');
  document.getElementById('avond').innerHTML=ITEMS.filter(i=>i.g==='avond').map(tileHTML).join('');
  const d=new Date(); const ds=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('date').textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
  ITEMS.forEach(i=>update(i));
}
function update(it, pop){
  const n=state.counts[it.id]||0, el=document.getElementById('t-'+it.id);
  const frac=Math.min(n/it.target,1);
  el.querySelector('.bar').style.strokeDashoffset=(C*(1-frac)).toFixed(2);
  const nEl=el.querySelector('.n'); if(nEl) nEl.textContent=n;
  const lim=el.querySelector('.lim'); if(lim) lim.textContent=(n>it.target)?'te veel':'max';
  el.dataset.n=n;
  el.classList.toggle('done', n===it.target);
  el.classList.toggle('over', it.kind==='max' && n>it.target);
  if(pop){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
  updateTotal();
}
function updateTotal(){
  const goals=ITEMS.filter(i=>i.kind==='goal');
  const done=goals.filter(i=>(state.counts[i.id]||0)>=i.target).length;
  document.getElementById('totalNum').textContent=done+'/'+goals.length;
  document.getElementById('totalBar').style.strokeDashoffset=(395.84*(1-done/goals.length)).toFixed(1);
  document.getElementById('total').classList.toggle('all',done===goals.length);
  document.getElementById('total').classList.toggle('zero',done===0);
  const left=goals.length-done;
  document.getElementById('sum').innerHTML = left===0 ? '<b>Alles gehaald</b> vandaag' : `Nog <b>${left} ${left===1?'doel':'doelen'}</b> te gaan`;
  document.getElementById('avondLabel').classList.toggle('all', ITEMS.filter(i=>i.g==='avond').every(i=>(state.counts[i.id]||0)>=i.target));
  document.title = left===0 ? 'Voedingscheck ✓' : 'Voedingscheck';
}
let recentT;
function markRecent(el){
  document.querySelectorAll('.tile.recent').forEach(t=>t.classList.remove('recent'));
  if(!el || el.dataset.n==='0') return;
  el.classList.add('recent'); clearTimeout(recentT); recentT=setTimeout(()=>el.classList.remove('recent'),3500);
}
function bump(id,delta){
  rollover();
  const it=ITEMS.find(i=>i.id===id); const cur=state.counts[id]||0;
  let n=cur+delta; if(n<0)n=0;
  if(it.kind==='goal'&&n>it.target)n=it.target;
  if(it.kind==='max'&&n>it.target+1)n=it.target+1;
  const el=document.getElementById('t-'+id);
  if(n===cur){ if(delta>0) toast(it.kind==='goal'?`${it.name}: doel al gehaald`:`${it.name}: maximum al bereikt`); markRecent(el); return; }
  state.counts[id]=n; save(); update(it,true); markRecent(el);
  if(navigator.vibrate) navigator.vibrate(n>=it.target?[10,30,10]:8);
  if(it.kind==='max'&&n>it.target) toast(`${it.name}: boven het maximum van vandaag`);
  else if(it.kind==='goal'&&n===it.target&&delta>0) toast(`${it.name} gehaald`);
}
let tmr=null, held=false, tid=null;
document.body.addEventListener('pointerdown',e=>{
  if(e.target.closest('.minus')) return;
  const t=e.target.closest('.tile'); if(!t) return; held=false; tid=t.dataset.id;
  tmr=setTimeout(()=>{held=true;bump(tid,-1)},500);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.body.addEventListener(ev,e=>{
  if(!tmr) return; clearTimeout(tmr); tmr=null;
  const t=e.target.closest('.tile');
  if(ev==='pointerup'&&t&&!held&&t.dataset.id===tid){
    const it=ITEMS.find(i=>i.id===tid);
    bump(tid, (it.g==='avond' && (state.counts[tid]||0)>=1) ? -1 : +1);
  }
}));
document.body.addEventListener('click',e=>{const m=e.target.closest('.minus'); if(m){e.stopPropagation();bump(m.dataset.minus,-1);}});
document.body.addEventListener('contextmenu',e=>{if(e.target.closest('.tile'))e.preventDefault()});
document.getElementById('more').addEventListener('click',()=>document.getElementById('sheet').classList.toggle('open'));
let armed=false, armT;
document.getElementById('reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!armed){armed=true;b.textContent='Tik nogmaals om alles van vandaag te wissen';b.classList.add('arm');clearTimeout(armT);armT=setTimeout(()=>{armed=false;b.textContent='Dag opnieuw beginnen';b.classList.remove('arm')},2500);return;}
  armed=false;b.textContent='Dag opnieuw beginnen';b.classList.remove('arm');state={date:todayKey(),counts:{}};save();renderAll();
  document.getElementById('sheet').classList.remove('open');toast('Dag opnieuw begonnen');
});
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500)}
renderAll();
try{ if(!localStorage.getItem(KEY+'.seen')){ setTimeout(()=>toast('Tik een tegel om af te vinken'),600); localStorage.setItem(KEY+'.seen','1'); } }catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollover()});
setInterval(rollover,60000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
